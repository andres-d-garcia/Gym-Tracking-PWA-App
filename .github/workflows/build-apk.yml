name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Derwin-Baptista-Gym.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derwin-Baptista-Gym-APK
          path: Derwin-Baptista-Gym.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Derwin Baptista Gym v1.0.0 (APK Android)"
          body: |
            ### 📱 Instalador Android (.apk) — Derwin Baptista Gym Tracking
            Descarga el archivo **`Derwin-Baptista-Gym.apk`** adjunto abajo e instálalo directamente en tu teléfono Android.
            - **100% Offline** (persistencia local en el teléfono).
            - **Botón 1-Clic a WhatsApp** con plantillas personalizables.
            - **Soporte de abonos parciales, captures y referencias verificadas.**
          files: Derwin-Baptista-Gym.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
