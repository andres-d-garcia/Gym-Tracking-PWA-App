name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Gym-Tracking.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Tracking-APK
          path: Gym-Tracking.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Gym Tracking v1.0.3 (APK Android)"
          body: |
            ### 📱 Instalador Android (.apk) — Gym Tracking v1.0.3
            Descarga el archivo **`Gym-Tracking.apk`** adjunto abajo e instálalo directamente en tu teléfono Android.
            - **💬 Mensajes de WhatsApp sincronizados (4 estados):** Incluye formato personalizable para **"Al día"**, **"Por vencer"**, **"Vence hoy"** y **"Vencido"**, con selector y vista previa exacta antes de enviar.
            - **🔔 Icono de Campana y Avisos en el Teléfono:** Configura cuántos días antes del vencimiento quieres recibir notificaciones locales en tu celular y prueba la alerta al instante.
            - **Diseño 100% Responsive:** Ajuste dinámico ante el teclado virtual y respeto automático de la barra inferior y superior del teléfono.
            - **100% Offline** (persistencia local en el teléfono).
          files: Gym-Tracking.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
